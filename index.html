<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="JS Idle Shmup — a browser bullet-hell / idle game that plays itself. Drag your ship with the mouse and grab power-ups.">
    <title>JS Idle Shmup — Browser Bullet Hell</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b16'/%3E%3Cpath d='M32 8l7 20 18 4-18 5-7 19-7-19-18-5 18-4z' fill='%2322d3ee'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #070b16;
            --panel: #101827;
            --line: #1e293b;
            --cyan: #22d3ee;
            --pink: #f472b6;
            --lime: #a3e635;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(900px 500px at 50% -12%, rgba(34, 211, 238, .13), transparent 70%),
                radial-gradient(600px 400px at 100% 100%, rgba(244, 114, 182, .08), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .shell { width: min(880px, 100% - 32px); margin: 0 auto; padding: 28px 0 40px; }
        .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
        .brand h1 {
            margin: 0;
            font-size: clamp(22px, 4vw, 32px);
            letter-spacing: -.02em;
            background: linear-gradient(90deg, var(--cyan), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .badge {
            flex: none;
            padding: 6px 10px;
            border: 1px solid rgba(34, 211, 238, .35);
            border-radius: 999px;
            color: var(--cyan);
            font: 600 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin-bottom: 14px; }
        .stat {
            flex: 1 1 140px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .035), transparent), var(--panel);
        }
        .stat .label {
            display: block;
            color: var(--muted);
            font: 600 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .stat .value { display: block; margin-top: 4px; font: 600 24px/1.1 ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
        .stat.kills .value { color: var(--cyan); }
        .stat.hits .value { color: var(--pink); }
        .stat.power .value { color: var(--lime); }
        .stage {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #000;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 1px rgba(34, 211, 238, .06);
        }
        .stage::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(255, 255, 255, .014) 3px 4px);
        }
        canvas { display: block; width: 100%; height: auto; background: #000; touch-action: none; }
        .pause-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(7, 11, 22, .72);
            backdrop-filter: blur(2px);
            color: var(--cyan);
            font: 600 28px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
            letter-spacing: .3em;
            z-index: 2;
        }
        .pause-overlay[hidden] { display: none; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 0; }
        button, summary {
            font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
            color: var(--text);
            cursor: pointer;
        }
        #pauseButton {
            padding: 11px 22px;
            border: 1px solid rgba(34, 211, 238, .5);
            border-radius: 999px;
            background: rgba(34, 211, 238, .12);
            color: var(--cyan);
            transition: background .15s ease, transform .15s ease;
        }
        #pauseButton:hover { background: rgba(34, 211, 238, .22); }
        #pauseButton:active { transform: translateY(1px); }
        .hint { color: var(--muted); font-size: 12px; }
        kbd {
            padding: 2px 6px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--panel);
            font: 600 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
            color: var(--text);
        }
        details {
            width: 100%;
            margin-top: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(16, 24, 39, .6);
        }
        summary { padding: 12px 16px; color: var(--muted); list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary::before { content: "+ "; color: var(--cyan); }
        details[open] summary::before { content: "− "; }
        .options { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 16px; }
        .options label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
        .options input {
            max-width: 240px;
            color: var(--text);
            font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        }
        @media (max-width: 560px) {
            .topbar { flex-direction: column; gap: 12px; }
            .badge { align-self: flex-start; }
            .stat { flex: 1 1 120px; padding: 10px 12px; }
            .stat .value { font-size: 20px; }
        }
        footer { margin-top: 24px; color: #64748b; font-size: 11px; text-align: center; }
        footer a { color: var(--muted); text-decoration-color: var(--line); }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <h1>JS Idle Shmup</h1>
                <p>A bullet-hell that plays itself. Drag your ship with the mouse, dodge everything, collect green power-ups.</p>
            </div>
            <span class="badge">Canvas 2D · No dependencies</span>
        </header>

        <section class="hud" aria-label="Game statistics">
            <div class="stat kills"><span class="label">Enemies downed</span><span class="value" id="enemiesDowned">0</span></div>
            <div class="stat hits"><span class="label">Player hits</span><span class="value" id="playerHits">0</span></div>
            <div class="stat power"><span class="label">Power-ups</span><span class="value" id="powerUpsCollected">0</span></div>
        </section>

        <div class="stage">
            <canvas id="gameCanvas" width="800" height="600" aria-label="Bullet hell game area"></canvas>
            <div class="pause-overlay" id="pauseOverlay" hidden>PAUSED</div>
        </div>

        <div class="toolbar">
            <button id="pauseButton" type="button" aria-pressed="false">Pause</button>
            <span class="hint"><kbd>P</kbd> to pause · mouse / touch to steer</span>
        </div>

        <details>
            <summary>Optional: use your own sprites</summary>
            <div class="options">
                <label>Player PNG<input type="file" id="playerImageUpload" accept="image/png"></label>
                <label>Enemy PNG<input type="file" id="enemyImageUpload" accept="image/png"></label>
            </div>
        </details>

        <footer>Open source by <a href="https://github.com/vihithr/JSIdleShmup">vihithr</a> · MIT</footer>
    </main>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isPaused = false;
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 30,
            height: 40,
            hitboxRadius: 3,
            bullets: [],
            dragging: false,
            hitCount: 0,
            firePower: 3,
            enhancedFirePower: false,
            enhancedBulletCount: 0,
            spreadAngle: Math.PI / 18
        };

        const maxEnhancedBullets = 100;
        let enemies = [];
        let enemyBullets = [];
        let items = [];
        let enemiesDowned = 0;
        let powerUpsCollected = 0;
        const enemySpawnInterval = 1500;
        const minDistance = 50;
        // 初始化玩家和敌人的图片
        let playerImage = new Image();
        let enemyImage = new Image();

        enemyImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAfCAYAAAD5h919AAAACXBIWXMAAAsTAAALEwEAmpwYAAAHvElEQVRIiZ2W229U1xXGf+c2V885c/H9OraxPZjY2ASSQuwQIEIJkdWqES9Vqz6V/BnlreqfkFSqVLVqH6JKVVDaKEqDSGgIIQlgY7CNPbZnbI89nvHMnJkz58yZy+mDE0SCKajraWvvre/ba+9vrf0JjuPwrBAVSZ2cnC6MvzDFK9PnAfjP5x8ze+86t29/rjWqdf1ZGMKziEKR1oU3z/9y5HB0gvTOGqZVBsDr8dHaFuXB2h3+9fFfFnPZdOz/JhqKHXXeOvsrHNtkafkOdadBR/sgAKntFSRBZPjQBILLy4ef/pmHC3eFp2GJB07Kojrx4ivOhamL5HYSJDYWyeZ3sSybU2cvcOrsBSzLJpvfJbGxSG4nwYWpi0y8+IojyqL63ER9A7HC1MR50ukkxXKeSsWiaOgMjUxgVkqYlRJDIxMUDX1/rZwnnU4yNXGevoFY4bmItHDkg/Gh42TSSeyqhW1bLMfnOTn9Judm3kaURERJ5NzM25ycfpPl+Dy2bWFXLTLpJONDx9HCkQ9+jPvojSRZUgRR9MZik4WecA/Zwi4uyU2uuEds+DhHjpyg4TToPbT/5onlBURBZH7+FgtLXxMKhLHrFSJaC8m9DRYWvtVqdvWRGuXvB1616e+D3bGZzlAXbk8T0VALub1dimUdAQeXy0tAbaZcNAFoaemjqGcQcJAlGa9fpTPcgm2a9IS7EYcbBdmlPCKTAWRZUgb6Rme6mqO0d/SjBoIEw63cu3eDRHKR7dQqix430+d+Snt/FIDt1TW+vvkl26lVLMtA08KMHn6J/F4avZhHkGQqVqWgyLKrWqtVhfHDJ5yBQxMM9Y+zmYozOXmGrY1FFLeXvZ01bn17FbenCbUpiNOo09M7DEAysYQgSuilPBWrxIljZwi3RalWTDq7R7h9+ypdHQPE1++R2lxG+N3v/+aIVReZnRTFco5QsBWrauCRXVilApVqlZX4HKZpYFomoZAPgFyujNfjxev1MzgwhltR8DRpWDUbj+Inl08T8IVobuugLlvIZrmMu1Zje2sZQRbQmjSCahsej5u0adASaicUamM3nWD+/hxqSwkAoxggNjxGS2svsuKipGcIhtuxrArlYpZyaQ8jnyWoaliKjWQ6tcsByUV8bR6XJGGVddLpJG5vE/0jY+jZHRpODb9PJaRq7GVK1Cs+Rg4dJRxpx6EOjkPfyDg7qSQrS99QLmYxy0W200m8ssKtr64ieDX1txMjL13uDPdQtkoUilnyehbVH+TMGxc5MfU6hUwWQy/gOA4eXwAAq1xEEAT8qobWHOHW9U+4+tH76EaeoBpBC0TweZrY2ksyu/DV5Ud11NrSWQkGm10oIk2Kn6A/iFHS6R0Y4dTZGTp6o+xsJYgvPABgIHaYts5eUok1vvj0Con4Iv4mlbyRp1Q1oNogn8/Y6d0t9w8K9vsIhILvdXX1/6ZD7aJas/G5vVTsCm6vH6HeQBb3m0mt0cCRRCqmgdvlplwxUWQXKX2Tzc3VPxRz+UsHdobHw9Pke3V8+MS1gMdPtV7H5/VTtW1kRUHzRwAoGFlq1SqKy0XZNFAkiaJlMLt067RVKn/2Y0z5xxOiIqqjsZeuvfbqz6FW5+7s5+zsbqCqEaSGC7/qByBf3KPm1Nnb3aA10sXR8WmQJcrVyjVREbVGtfGDz/BRRqIkCsHmFms4Ou66cO7XeH0ekAQSC3cpGAW200ncLhdvXBwB4KP3F6nYNu2tPWh+jd7YUag7mGWLf/77Tyytzdr5zK6nUW84PyBq7ex2Tk68znB0jJ6BFzDKOdLJFVq7B7CtClbNYv7eNdq6twDY2ejkyAun8cgeXB436Y04rT2D+H0hkvF7LK3NcePOJ6S3NgR47Juw         // 处理玩家图片上传
        document.getElementById('playerImageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    playerImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 处理敌人图片上传
        document.getElementById('enemyImageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    enemyImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function createEnemy(x, y) {
            return {
                x: x,
                y: y,
                width: 40,
                height: 40,
                health: 3
            };
        }

        function spawnEnemies() {
            setInterval(() => {
                let x = Math.random() * (canvas.width - 60) + 30;
                enemies.push(createEnemy(x, 50));
            }, enemySpawnInterval);
        }

        function gameLoop() {
            if (isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制玩家
            ctx.drawImage(playerImage, player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);

            // 绘制玩家的碰撞箱
            ctx.fillStyle = 'rgba(255, 0, 0, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.hitboxRadius, 0, Math.PI * 2);
            ctx.fill();

            // 绘制自动躲避检测范围
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, minDistance, 0, Math.PI * 2);
            ctx.stroke();

            if (player.dragging) {
                const mousePos = getMousePos();
                ctx.strokeStyle = 'white';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.stroke();
            }

            player.bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                bullet.x += bullet.speedX;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();

                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x > enemy.x - enemy.width / 2 &&
                        bullet.x < enemy.x + enemy.width / 2 &&
                        bullet.y > enemy.y - enemy.height / 2 &&
                        bullet.y < enemy.y + enemy.height / 2) {
                        enemy.health--;
                        player.bullets.splice(index, 1);
                        if (enemy.health <= 0) {
                            enemies.splice(enemyIndex, 1);
                            enemiesDowned++;
                            document.getElementById('enemiesDowned').innerText = enemiesDowned;

                            if (Math.random() < 0.3) {
                                items.push({
                                    x: enemy.x,
                                    y: enemy.y,
                                    width: 15,
                                    height: 15
                                });
                            }
                        }
                    }
                });
            });

            player.bullets = player.bullets.filter(b => b.y > 0);
            let enemiesBulletSpeed = 1.5;

            enemies.forEach(enemy => {
                ctx.drawImage(enemyImage, enemy.x - enemy.width / 2, enemy.y - enemy.height / 2, enemy.width, enemy.height);

                if (Math.random() < 0.03) {
                    let numBullets = [2, 5, 7][Math.floor(Math.random() * 3)];
                    let baseAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                    for (let i = 0; i < numBullets; i++) {
                        let angleOffset = (i - (numBullets - 1) / 2) * (Math.PI / 6);
                        let angle = baseAngle + angleOffset;
                        let randomOffset = Math.random() * 0.3 * (Math.random() > 0.5 ? 1 : -1);
                        let angleWithOffset = angle + randomOffset;

                        enemyBullets.push({
                            x: enemy.x,
                            y: enemy.y,
                            speedX: Math.cos(angleWithOffset) * enemiesBulletSpeed,
                            speedY: Math.sin(angleWithOffset) * enemiesBulletSpeed
                        });
                    }
                }
            });

            enemyBullets.forEach((bullet, index) => {
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();

                let dx = bullet.x - player.x;
                let dy = bullet.y - player.y;
                if (Math.sqrt(dx * dx + dy * dy) < player.hitboxRadius) {
                    console.log('Player hit!');
                    enemyBullets.splice(index, 1);
                    player.hitCount++;
                    document.getElementById('playerHits').innerText = player.hitCount;
                }
            });

            enemyBullets = enemyBullets.filter(b => b.y < canvas.height && b.y > 0 && b.x > 0 && b.x < canvas.width);

            items.forEach((item, index) => {
                item.y += 2;
                ctx.fillStyle = 'green';
                ctx.fillRect(item.x - item.width / 2, item.y - item.height / 2, item.width, item.height);

                if (item.x > player.x - player.width / 2 &&
                    item.x < player.x + player.width / 2 &&
                    item.y > player.y - player.height / 2 &&
                    item.y < player.y + player.height / 2) {
                    items.splice(index, 1);
                    player.enhancedFirePower = true;
                    player.enhancedBulletCount = 0;
                    player.firePower = 7 + Math.floor(Math.random() * 3) * 2;
                    player.spreadAngle = Math.PI / 1.5;
                    powerUpsCollected++;
                    document.getElementById('powerUpsCollected').innerText = powerUpsCollected;
                }
            });

            items = items.filter(i => i.y < canvas.height);

            autoEvadeAndTarget();

            if (player.enhancedFirePower) {
                player.enhancedBulletCount++;
                if (player.enhancedBulletCount > maxEnhancedBullets) {
                    player.enhancedFirePower = false;
                    player.firePower = 3;
                    player.spreadAngle = Math.PI / 18;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        let mouseX = 0;
        let mouseY = 0;

        // Convert viewport coordinates into the canvas' 800x600 game space,
        // so mouse and touch stay accurate when the canvas is scaled by CSS.
        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        }

        canvas.addEventListener('pointerdown', (e) => {
            updatePointer(e);
            player.dragging = true;
            if (e.pointerType === 'mouse') canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', updatePointer);

        canvas.addEventListener('pointerup', () => {
            player.dragging = false;
        });

        canvas.addEventListener('pointercancel', () => {
            player.dragging = false;
        });

        canvas.addEventListener('pointerleave', (e) => {
            if (e.pointerType === 'mouse') player.dragging = false;
        });

        function autoEvadeAndTarget() {
            let totalMoveX = 0;
            let totalMoveY = 0;

            enemyBullets.forEach(bullet => {
                let dx = bullet.x - player.x;
                let dy = bullet.y - player.y;
                if(dx < minDistance && dy < minDistance) {
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < minDistance) {
                        let speed = 12 / (distance + 1);
                        let moveX = Math.cos(Math.atan2(dy, dx)) * speed;
                        let moveY = Math.sin(Math.atan2(dy, dx)) * speed;

                        totalMoveX -= moveX;
                        totalMoveY -= moveY;
                    }
                }
            });

            player.x += totalMoveX;
            player.y += totalMoveY;

            if (player.y < canvas.height / 2) {
                player.y = canvas.height / 2;
            }

            if (!player.dragging) {
                let closestEnemy = null;
                let minDistance = Infinity;

                enemies.forEach(enemy => {
                    let dx = enemy.x - player.x;
                    let dy = enemy.y - player.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestEnemy = enemy;
                    }
                });

                if (closestEnemy) {
                    if (closestEnemy.x > player.x) {
                        player.x += 1 * (closestEnemy.x - player.x)/150 + 0.8;
                    } else {
                        player.x -= 1 * (player.x - closestEnemy.x)/150 + 0.8;
                    }
                    if (closestEnemy.y > player.y) {
                        player.y += 0.3;
                    } else {
                        player.y -= 0.3;
                    }
                    if (player.y < canvas.height/1.5)
                    {
                        player.y += 0.2;
                    }
                    else
                    {
                        player.y -= 0.2;
                    }
                }
            } else {
                if (mouseX > player.x) {
                    player.x += 1 * (mouseX - player.x)/100 + 0.4;
                } else {
                    player.x -= 1 * (player.x - mouseX)/100 + 0.4;
                }
                if (mouseY > player.y) {
                    player.y += 1 * (mouseY - player.y)/100 + 0.4;
                } else {
                    player.y -= 1 * (player.y - mouseY)/100 + 0.4;
                }
            }

            if (player.x < player.width / 2) {
                player.x = player.width / 2;
            }
            if (player.x > canvas.width - player.width / 2) {
                player.x = canvas.width - player.width / 2;
            }
            if (player.y < player.height / 2) {
                player.y = player.height / 2;
            }
            if (player.y > canvas.height - player.height / 2) {
                player.y = canvas.height - player.height / 2;
            }
        }

        function getMousePos() {
            return {
                x: mouseX,
                y: mouseY
            };
        }

        function togglePause() {
            isPaused = !isPaused;
            const button = document.getElementById('pauseButton');
            button.textContent = isPaused ? 'Resume' : 'Pause';
            button.setAttribute('aria-pressed', String(isPaused));
            document.getElementById('pauseOverlay').hidden = !isPaused;
            if (!isPaused) {
                gameLoop();
            }
        }

        setInterval(() => {
            if (!isPaused) {
                let bulletSpread = player.firePower;
                let spreadAngle = player.spreadAngle;
                for (let i = 0; i < bulletSpread; i++) {
                    let angle = -spreadAngle + (spreadAngle * 2) * (i / (bulletSpread - 1));
                    player.bullets.push({
                        x: player.x + Math.sin(angle) * 10,
                        y: player.y,
                        speedX: Math.sin(angle) * 2,
                        speed: 8
                    });
                }
            }
        }, 100);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
        });

        document.getElementById('pauseButton').addEventListener('click', togglePause);

        spawnEnemies();
        gameLoop();
    </script>
</body>
</html>
